[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "revumind"
version = "0.0.1"
description = "The Multimodal Product Review Intelligence System is an intelligent platform that analyzes product reviews using both textual and visual data. By leveraging advanced machine learning and natural language processing techniques, the system provides deep insights into product perceptions and customer feedback across multiple modalities."
authors = [
  { name = "Aman" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.14.0"

[tool.black]
line-length = 99
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
)/
'''

[tool.isort]
profile = "black"
known_first_party = ["revumind"]
force_sort_within_sections = true


